<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鋐品農產行">
<meta name="theme-color" content="#052e16">
<title>鋐品農產行 ERP</title>
<script>window.tailwind=window.tailwind||{};</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>tailwind.config={corePlugins:{preflight:true}};</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --safe-l:   env(safe-area-inset-left,  0px);
  --safe-r:   env(safe-area-inset-right, 0px);
  --green:    #166534;
  --green-dk: #052e16;
  --amber:    #d97706;
  --radius:   14px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
html { height:100%; }
body {
  font-family:'Noto Sans TC','PingFang TC',sans-serif;
  background:#f0ede6;
  min-height:100%;
  margin:0;
}

/* ── Header 固定在頂部 ── */
#header {
  position:fixed; top:0; left:0; right:0; z-index:40;
  background:#052e16;
  padding-top: env(safe-area-inset-top, 0px);
}

/* ── 底部導覽固定 ── */
#bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:#fff;
  border-top:1px solid #e5e2db;
  display:flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -2px 12px rgba(0,0,0,.08);
}

/* ── 內容區（header + bottom-nav 高度留空） ── */
#content {
  padding-top: calc(68px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  padding-left: 14px;
  padding-right: 14px;
  min-height: 100vh;
}

.bnav-btn {
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; padding:8px 2px 6px;
  border:none; background:none; cursor:pointer; font-family:inherit;
  color:#a8a29e; transition:color .15s; min-height:56px;
}
.bnav-btn .bico { font-size:22px; line-height:1; }
.bnav-btn .blbl { font-size:10px; font-weight:700; line-height:1; }
.bnav-btn.on { color:var(--green); }
.bnav-btn.on .blbl { color:var(--green); }

/* ── 基本元件 ── */
.hide { display:none !important; }
.card { background:#fff; border-radius:var(--radius); border:1px solid #e5e2db; box-shadow:0 1px 6px rgba(0,0,0,.06); }
.p4 { padding:16px; }

/* Modal — 從底部滑上來 */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:flex-end; }
.modal-box {
  background:#fff; width:100%; border-radius:22px 22px 0 0;
  padding:20px 16px calc(20px + var(--safe-bot));
  max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  max-width:512px; margin:0 auto;
}
/* Modal 拖動把手 */
.modal-box::before {
  content:''; display:block; width:36px; height:4px;
  background:#d6d3d1; border-radius:2px; margin:0 auto 16px;
}

/* ── 輸入欄位（手機加大） ── */
.inp {
  width:100%; padding:13px 14px; border-radius:12px;
  border:2px solid #e5e2db; background:#fafaf7;
  font-size:16px; /* 防止 iOS 自動放大 */
  font-family:inherit; outline:none; transition:border-color .15s;
  -webkit-appearance:none;
}
.inp:focus { border-color:var(--green); }
select.inp { appearance:none; -webkit-appearance:none; }
textarea.inp { resize:none; }

/* ── 標籤文字 ── */
.field-lbl { font-size:13px; font-weight:700; color:#6b7280; margin-bottom:6px; }

/* ── 按鈕 ── */
.btn { border:none; border-radius:12px; font-weight:700; font-family:inherit; cursor:pointer; transition:all .12s; -webkit-appearance:none; }
.btn:active { transform:scale(.97); opacity:.85; }
.btn-g  { background:var(--green); color:#fff; }
.btn-a  { background:var(--amber); color:#fff; }
.btn-gh { background:#f5f4f0; color:#44403c; border:1px solid #e5e2db; }
.btn-r  { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
.btn-b  { background:#1d4ed8; color:#fff; }
.btn-p  { background:#7c3aed; color:#fff; }
/* 尺寸 */
.btn-sm { padding:8px 14px; font-size:13px; }
.btn-md { padding:12px 18px; font-size:15px; }
.btn-lg { padding:15px; font-size:16px; width:100%; border-radius:14px; }
/* 儲存按鈕回饋動畫 */
.btn-saved { background:#22c55e !important; }

/* ── Tag/Pill ── */
.tag { display:inline-flex; align-items:center; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
.pill { padding:8px 16px; border-radius:999px; border:2px solid #e5e2db; background:#fafaf7; color:#78716c; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; -webkit-appearance:none; }
.pill.on { border-color:var(--green); background:var(--green); color:#fff; }

/* ── 橫條 ── */
.bar { height:7px; border-radius:999px; background:#e5e2db; overflow:hidden; }
.bar-fill { height:100%; border-radius:999px; }

/* ── Sub-tabs ── */
.stab-wrap { display:flex; background:#fff; border-radius:14px; padding:4px; border:1px solid #e5e2db; gap:3px; margin-bottom:14px; }
.stab { flex:1; padding:9px 4px; border-radius:10px; font-size:12px; font-weight:700; color:#78716c; border:none; background:none; cursor:pointer; font-family:inherit; transition:all .15s; }
.stab.on { background:var(--green); color:#fff; }
.stab.am.on { background:var(--amber); color:#fff; }

/* ── 成本大格 ── */
.cg {
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:16px 8px; border-radius:14px; border:2.5px solid #e5e2db;
  background:#fafaf7; cursor:pointer; transition:all .15s; font-family:inherit; width:100%;
}
.cg.on { border-color:var(--c); background:var(--bg); }
.cg .ico { font-size:28px; line-height:1; }
.cg .lbl { font-size:13px; font-weight:900; color:#78716c; text-align:center; }
.cg.on .lbl { color:var(--c); }
.cg .desc { font-size:10px; color:#a8a29e; text-align:center; line-height:1.4; }
.cg.on .desc { color:var(--c); opacity:.8; }

/* ── 田區 plot-btn ── */
.plot-btn { padding:8px 16px; border-radius:999px; border:2px solid #e5e2db; background:#fafaf7; color:#78716c; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; }
.plot-btn.active { border-color:var(--green); background:var(--green); color:#fff; }

/* cat-btn（舊版天氣等用到） */
.cat-btn { display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px 6px; border-radius:12px; border:2px solid #e5e2db; background:#fafaf7; cursor:pointer; transition:all .15s; font-family:inherit; }
.cat-btn.active { border-color:var(--c); background:var(--bg); }
.cat-btn span.lbl { font-size:12px; font-weight:800; color:#78716c; line-height:1.2; text-align:center; }
.cat-btn.active span.lbl { color:var(--c); }

/* date input 修正 */
input[type=date] { -webkit-appearance:none; }
input[type=date]::-webkit-calendar-picker-indicator { opacity:.5; width:20px; height:20px; }
input[type=number]::-webkit-inner-spin-button { opacity:.5; }

/* ── 捲動優化 ── */
.modal-box::-webkit-scrollbar { display:none; }
#content::-webkit-scrollbar { display:none; }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px">
    <div>
      <div style="font-size:9px;letter-spacing:3px;color:#86efac;opacity:.55">HONG PIN FARM</div>
      <div style="font-size:18px;font-weight:900;color:#fff;font-family:Georgia,serif;line-height:1.1">鋐品農產行</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="text-align:right">
        <div id="hToday" style="font-size:11px;color:#86efac;opacity:.7"></div>
        <div id="hStat"  style="font-size:11px;color:#86efac;font-weight:700"></div>
      </div>
      <button onclick="openBackupModal()" style="background:rgba(255,255,255,.18);border:none;color:#d1fae5;font-size:11px;font-weight:700;padding:7px 12px;border-radius:10px;cursor:pointer;font-family:inherit;white-space:nowrap">💾 備份</button>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div id="content">
  <div id="page-dashboard" class="hide"></div>
  <div id="page-farm"      class="hide"></div>
  <div id="page-process"   class="hide"></div>
  <div id="page-reports"   class="hide"></div>
  <div id="page-sop"       class="hide"></div>
</div>

<!-- 底部導覽列 -->
<div id="bottom-nav">
  <button class="bnav-btn" id="mtab-dashboard" onclick="switchMain('dashboard')">
    <span class="bico">🏠</span><span class="blbl">總覽</span>
  </button>
  <button class="bnav-btn" id="mtab-farm" onclick="switchMain('farm')">
    <span class="bico">🌾</span><span class="blbl">種植</span>
  </button>
  <button class="bnav-btn" id="mtab-process" onclick="switchMain('process')">
    <span class="bico">📦</span><span class="blbl">運營</span>
  </button>
  <button class="bnav-btn" id="mtab-reports" onclick="switchMain('reports')">
    <span class="bico">📒</span><span class="blbl">報表</span>
  </button>
  <button class="bnav-btn" id="mtab-sop" onclick="switchMain('sop')">
    <span class="bico">📋</span><span class="blbl">SOP</span>
  </button>
</div>

<!-- MODAL -->
<div id="modalBg" class="modal-bg hide" onclick="closeModal(event)">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
'use strict';
/* ═══════════════════════════════════════════════
   常數
═══════════════════════════════════════════════ */
const PLOT_TYPES = [
  {id:'self',    label:'自種田', icon:'🌾', color:'#15803d', bg:'#dcfce7'},
  {id:'managed', label:'代管田', icon:'🤝', color:'#0369a1', bg:'#dbeafe'},
  {id:'bought',  label:'收購田', icon:'💼', color:'#7c3aed', bg:'#ede9fe'},
];
// 作業大分類（登錄時選這四個）
const COST_GROUPS = [
  { id:'labor',  label:'人事成本', icon:'👷', color:'#1d4ed8', bg:'#dbeafe',
    desc:'工資・採收人工・噴藥工', cats:['labor'] },
  { id:'agri',   label:'農資成本', icon:'🌿', color:'#15803d', bg:'#dcfce7',
    desc:'農藥・肥料・種苗・生物資材', cats:['spray','fertilize'] },
  { id:'supply', label:'耗材成本', icon:'📦', color:'#7c3aed', bg:'#ede9fe',
    desc:'繩子・膠帶・紙箱・油錢・冰磚', cats:['ridge','irrigate'] },
  { id:'land',   label:'土地成本', icon:'🏡', color:'#92400e', bg:'#fef9ee',
    desc:'地租・購地・土地攤提', cats:['other'] },
];
const FARM_CATS = [
  {id:'spray',     label:'噴藥',  icon:'💧', color:'#0891b2', bg:'#cffafe'},
  {id:'fertilize', label:'施肥',  icon:'🌿', color:'#16a34a', bg:'#dcfce7'},
  {id:'labor',     label:'人工',  icon:'👷', color:'#d97706', bg:'#fef3c7'},
  {id:'ridge',     label:'培土',  icon:'⛏️', color:'#92400e', bg:'#fef9ee'},
  {id:'irrigate',  label:'灌溉',  icon:'🚿', color:'#1d4ed8', bg:'#dbeafe'},
  {id:'other',     label:'其他',  icon:'📋', color:'#6b7280', bg:'#f3f4f6'},
];
const PROC_CATS = [
  {id:'harvest_labor', label:'採收人工',   icon:'🧑‍🌾', color:'#15803d', bg:'#dcfce7'},
  {id:'supply_pack',   label:'耗材＋包裝', icon:'📦',  color:'#7c3aed', bg:'#ede9fe'},
  {id:'tie_cost',      label:'綁蔥成本',   icon:'🧅',  color:'#d97706', bg:'#fef3c7'},
  {id:'manpower',      label:'人力成本',   icon:'👥',  color:'#0369a1', bg:'#dbeafe'},
  {id:'fuel',          label:'油',         icon:'⛽',  color:'#b45309', bg:'#fef3c7'},
  {id:'utility',       label:'水電',       icon:'💡',  color:'#0891b2', bg:'#ecfeff'},
  {id:'misc',          label:'其他雜項',   icon:'📋',  color:'#6b7280', bg:'#f3f4f6'},
];
const SALE_PRODS = [
  {id:'1kg',   label:'1公斤包裝',     icon:'📦'},
  {id:'3kg',   label:'3公斤包裝',     icon:'📦'},
  {id:'trace', label:'產銷履歷蔥',    icon:'🏷️'},
  {id:'black', label:'黑頭蔥（整捆）',icon:'🧅'},
  {id:'other', label:'其他加工品',    icon:'🔖'},
];
const CHANNELS = [
  {id:'market',     label:'傳統市場/行口'},
  {id:'auction',    label:'拍賣市場'},
  {id:'restaurant', label:'餐廳/企業'},
  {id:'direct',     label:'直銷/自售'},
  {id:'online',     label:'網路通路'},
  {id:'other',      label:'其他'},
];

/* ═══════════════════════════════════════════════
   資料 (localStorage)
═══════════════════════════════════════════════ */
const LS_K = {plots:'hp6_plots', ops:'hp6_ops', agri:'hp6_agri', proc:'hp6_proc', sales:'hp6_sales', weather:'hp6_weather'};
let DB = {
  plots: [], ops: [], agri: [], proc: [], sales: [], weather: []
};
function loadDB() {
  for (const k in LS_K) {
    try { DB[k] = JSON.parse(localStorage.getItem(LS_K[k])) || []; } catch { DB[k] = []; }
  }
}
function saveDB() {
  for (const k in LS_K) {
    try { localStorage.setItem(LS_K[k], JSON.stringify(DB[k])); } catch {}
  }
}
loadDB();

/* ═══════════════════════════════════════════════
   工具
═══════════════════════════════════════════════ */
const uid   = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today = () => new Date().toISOString().slice(0,10);
const fmt   = n  => Math.round(Number(n)||0).toLocaleString('zh-TW');
const fmtD  = n  => (Number(n)||0).toFixed(1);
const dayDiff = a => a ? Math.floor((Date.now()-new Date(a))/86400000) : null;
const mLabel  = ym => { const [y,m]=ym.split('-'); return `${y}/${m}`; };
const catOf   = (list,id) => list.find(c=>c.id===id)||list[list.length-1];
const ptOf    = id => PLOT_TYPES.find(t=>t.id===id)||PLOT_TYPES[0];
const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const H = (strings,...vals) => strings.reduce((a,s,i)=>a+s+(vals[i]!==undefined?esc(String(vals[i])):''),'');

function tagHTML(label, color, bg) {
  return `<span class="tag" style="color:${color};background:${bg}">${esc(label)}</span>`;
}

/* 每田區分攤後成本 */
function plotFarmCost(pid) {
  return DB.ops.filter(o=>{
    const ids = Array.isArray(o.plotIds) ? o.plotIds : [o.plotId].filter(Boolean);
    return ids.includes(pid);
  }).reduce((s,o)=>s+(o.perPlotAmt??o.amount),0) + (DB.plots.find(p=>p.id===pid)?.landCost||0);
}
function plotMeta(p) {
  const myOps = DB.ops.filter(o=>{ const ids=Array.isArray(o.plotIds)?o.plotIds:[o.plotId].filter(Boolean); return ids.includes(p.id); });
  const lastSpray = myOps.filter(o=>o.cat==='spray').sort((a,b)=>b.date.localeCompare(a.date))[0]?.date||null;
  const lastFert  = myOps.filter(o=>o.cat==='fertilize').sort((a,b)=>b.date.localeCompare(a.date))[0]?.date||null;
  const cost = myOps.reduce((s,o)=>s+(o.perPlotAmt??o.amount),0)+(p.landCost||0);
  const area = parseFloat(p.area)||0;
  return { lastSpray, lastFert, cost, days:dayDiff(p.plantDate), costPerFen: area>0?Math.round(cost/area):null };
}

/* ═══════════════════════════════════════════════
   Modal
═══════════════════════════════════════════════ */
function openModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBg').classList.remove('hide');
  document.getElementById('modalBox').scrollTop = 0;
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modalBg')) {
    document.getElementById('modalBg').classList.add('hide');
  }
}
window._closeModal = () => document.getElementById('modalBg').classList.add('hide');

/* ═══════════════════════════════════════════════
   Main Tab 切換
═══════════════════════════════════════════════ */
let currentMain = 'dashboard';
function switchMain(tab) {
  currentMain = tab;
  ['dashboard','farm','process','reports','sop'].forEach(t => {
    document.getElementById('page-'+t).classList.add('hide');
    document.getElementById('mtab-'+t).classList.remove('on');
  });
  document.getElementById('page-'+tab).classList.remove('hide');
  document.getElementById('mtab-'+tab).classList.add('on');
  renderAll();
}

/* ═══════════════════════════════════════════════
   Sub Tab 狀態
═══════════════════════════════════════════════ */
let farmSub = 'plots';   // plots | ops | calendar
let procSub = 'cost';    // cost | sales | channel
let calYm   = today().slice(0,7);
let opSelectedPlots = [];
let opCat = '';
let opCostGroup = ''; // new: top-level cost group
let procCat = '';
let saleMode = 'single';
let saleProd = '';
let saleChan = '';
let agriTab = 'list';
let agriUseItem = null;

/* ═══════════════════════════════════════════════
   全域 renderAll
═══════════════════════════════════════════════ */
function renderAll() {
  // header stat
  document.getElementById('hToday').textContent = today();
  const act = DB.plots.filter(p=>!p.closed&&!p.sold).length;
  document.getElementById('hStat').textContent = `${act} 田區 · ${DB.sales.length} 筆銷售`;

  if (currentMain === 'dashboard') renderDash();
  if (currentMain === 'farm')      renderFarm();
  if (currentMain === 'process')   renderProc();
  if (currentMain === 'reports')   renderReports();
  if (currentMain === 'sop')       renderSOP();
}

/* ════════════════════════════════════════════════════════
   ██████  DASHBOARD
════════════════════════════════════════════════════════ */
function renderDash() {
  const farmCost  = DB.ops.reduce((s,o)=>s+o.amount,0)+DB.plots.reduce((s,p)=>s+(p.landCost||0),0);
  const procCost  = DB.proc.reduce((s,o)=>s+o.amount,0);
  const totalRev  = DB.sales.reduce((s,x)=>s+x.revenue,0);
  const procProfit= totalRev-procCost;
  const totalProfit = totalRev-farmCost-procCost;
  const actPlots  = DB.plots.filter(p=>!p.closed&&!p.sold);
  const clr = totalProfit>=0?'#86efac':'#fca5a5';

  // monthly
  const monthly = {};
  DB.ops.forEach(o=>{if(o.date){const k=o.date.slice(0,7);if(!monthly[k])monthly[k]={farm:0,proc:0,rev:0};monthly[k].farm+=o.amount;}});
  DB.proc.forEach(o=>{if(o.date){const k=o.date.slice(0,7);if(!monthly[k])monthly[k]={farm:0,proc:0,rev:0};monthly[k].proc+=o.amount;}});
  DB.sales.forEach(s=>{const d=s.date||s.dateFrom;if(d){const k=d.slice(0,7);if(!monthly[k])monthly[k]={farm:0,proc:0,rev:0};monthly[k].rev+=s.revenue;}});
  const monthlyRows = Object.entries(monthly).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,5);

  let html = `
  <!-- 主損益卡 -->
  <div class="rounded-3xl p-5 text-white mb-4 relative overflow-hidden" style="background:linear-gradient(135deg,#052e16 0%,#14532d 60%,#166534 100%)">
    <div class="text-xs tracking-widest opacity-60 mb-1">鋐品農產行 · 全場</div>
    <div class="text-xs font-bold opacity-70 mb-0.5">全場累計淨損益</div>
    <div class="text-4xl font-black mb-1" style="font-family:Georgia,serif;color:${clr}">${totalProfit>=0?'＋':'－'} NT$${fmt(Math.abs(totalProfit))}</div>
    <div class="text-xs opacity-50 mb-4">收入 − 種植成本 − 運營成本</div>
    <div class="grid grid-cols-3 gap-2">
      ${[['種植成本',farmCost,'#fca5a5'],['運營成本',procCost,'#fdba74'],['總收入',totalRev,'#86efac']].map(([l,v,c])=>`
      <div style="background:rgba(255,255,255,.1);border-radius:12px;padding:8px 6px;text-align:center">
        <div style="font-size:10px;opacity:.7">${l}</div>
        <div style="font-weight:900;font-size:13px;color:${c}">NT$${fmt(v)}</div>
      </div>`).join('')}
    </div>
  </div>

  <!-- 快速入口 -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <button onclick="switchMain('farm')" class="btn btn-g text-left p-4 rounded-2xl">
      <div style="font-size:24px;margin-bottom:4px">🌾</div>
      <div class="font-black text-sm">種植管理</div>
      <div class="text-xs opacity-70">${actPlots.length} 田區運作中</div>
    </button>
    <button onclick="switchMain('process')" class="btn btn-a text-left p-4 rounded-2xl">
      <div style="font-size:24px;margin-bottom:4px">📦</div>
      <div class="font-black text-sm">加工與銷售</div>
      <div class="text-xs opacity-70">NT$${fmt(totalRev)} 累計收入</div>
    </button>
  </div>

  <!-- 種植帳目 -->
  <div style="border-radius:16px;border:2px solid #bbf7d0;overflow:hidden;margin-bottom:12px">
    <div style="background:#166534;color:#fff;padding:10px 16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="font-black text-sm">🌾 種植管理帳目</div>
        <div style="font-size:11px;opacity:.85">總成本 NT$${fmt(farmCost)}</div>
      </div>
      ${(()=>{
        const ap = DB.plots.filter(p=>!p.closed&&!p.sold);
        const areaByType = {};
        PLOT_TYPES.forEach(t=>{ areaByType[t.id]=0; });
        ap.forEach(p=>{ const a=parseFloat(p.area)||0; if(areaByType[p.type]!==undefined) areaByType[p.type]+=a; });
        const totalArea = ap.reduce((s,p)=>s+(parseFloat(p.area)||0),0);
        if(!totalArea) return '';
        return `<div style="display:flex;flex-wrap:wrap;gap:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.2)">
          <div style="background:rgba(255,255,255,.15);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700">
            📐 合計 <span style="font-size:14px;font-weight:900">${totalArea}</span> 分地
          </div>
          ${PLOT_TYPES.map(t=>areaByType[t.id]>0?`<div style="background:rgba(255,255,255,.1);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:600;opacity:.9">${t.icon} ${t.label} ${areaByType[t.id]} 分</div>`:'').join('')}
        </div>`;
      })()}
    </div>
    <div style="background:#fff;padding:12px">
      ${actPlots.length===0?'<div style="text-align:center;color:#a8a29e;padding:16px;font-size:13px">尚無進行中田區</div>':
        actPlots.map(p=>{
          const m=plotMeta(p); const pt=ptOf(p.type);
          const tkn=(p.harvests||[]).reduce((s,h)=>s+h.kg,0);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f4">
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <span style="font-weight:700;font-size:14px">${esc(p.name)}</span>
                ${tagHTML(pt.icon+' '+pt.label, pt.color, pt.bg)}
                ${p.traceability?tagHTML('🏷️ 履歷','#7c3aed','#ede9fe'):''}
              </div>
              <div style="font-size:11px;color:#a8a29e;margin-top:2px">${m.days!==null?`第${m.days}天`:''}${p.area?` · ${p.area}分地`:''}${tkn>0?` · 已收${fmt(tkn)}kg`:''}</div>
            </div>
            <div style="text-align:right;margin-left:8px;flex-shrink:0">
              <div style="font-weight:900;color:#dc2626;font-size:13px">NT$${fmt(m.cost)}</div>
              ${m.costPerFen!==null?`<div style="font-size:10px;color:#a8a29e">≈${fmt(m.costPerFen)}/分</div>`:''}
            </div>
          </div>`;
        }).join('')
      }
    </div>
  </div>

  <!-- 加工銷售帳目 -->
  <div style="border-radius:16px;border:2px solid #fde68a;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)">
    <div style="background:#d97706;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="font-black text-sm">📦 加工銷售帳目</div>
        <div style="font-size:11px;opacity:.8">獨立於種植成本</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:10px;opacity:.8">加工損益</div>
        <div style="font-weight:900;font-size:18px;color:${procProfit>=0?'#d1fae5':'#fee2e2'}">${procProfit>=0?'▲':'▼'} NT$${fmt(Math.abs(procProfit))}</div>
      </div>
    </div>
    <div style="background:#fff;padding:16px">
      <div class="grid grid-cols-3 gap-2 mb-3">
        ${[['運營成本',procCost,'#dc2626','#fef2f2'],['銷售收入',totalRev,'#16a34a','#f0fdf4'],['加工損益',procProfit,procProfit>=0?'#16a34a':'#dc2626',procProfit>=0?'#f0fdf4':'#fef2f2']].map(([l,v,tc,bg])=>`
        <div style="background:${bg};border-radius:12px;padding:8px;text-align:center">
          <div style="font-size:10px;color:#6b7280">${l}</div>
          <div style="font-weight:900;font-size:13px;color:${tc}">NT$${fmt(Math.abs(v))}</div>
        </div>`).join('')}
      </div>
      ${DB.proc.length>0?`<div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:6px">運營成本結構</div>
      ${PROC_CATS.map(c=>{const a=DB.proc.filter(o=>o.cat===c.id).reduce((s,o)=>s+o.amount,0);if(!a)return'';const pct=procCost>0?Math.round(a/procCost*100):0;return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="color:${c.color};font-size:11px;font-weight:700;width:76px;flex-shrink:0">${c.icon} ${c.label}</span><div class="bar" style="flex:1"><div class="bar-fill" style="width:${pct}%;background:${c.color}"></div></div><span style="font-size:11px;font-weight:700;color:#374151;width:52px;text-align:right;flex-shrink:0">NT$${fmt(a)}</span></div>`;}).join('')}`:''}
    </div>
  </div>

  <!-- 月損益 -->
  ${monthlyRows.length>0?`<div class="card p-4">
    <div class="font-black text-stone-700 mb-3" style="font-family:serif">📅 近 5 個月損益</div>
    ${monthlyRows.map(([ym,{farm,proc,rev}])=>{const pl=rev-farm-proc;return`<div style="padding:6px 0;border-bottom:1px solid #f5f5f4">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:700;font-size:14px;color:#44403c">${mLabel(ym)}</div>
        <div style="font-weight:900;font-size:13px;color:${pl>=0?'#16a34a':'#dc2626'}">${pl>=0?'▲':'▼'} NT$${fmt(Math.abs(pl))}</div>
      </div>
      <div style="font-size:11px;color:#a8a29e;margin-top:2px">種植 NT$${fmt(farm)} · 加工 NT$${fmt(proc)} · <span style="color:#16a34a">收入 NT$${fmt(rev)}</span></div>
    </div>`;}).join('')}
  </div>`:''}`;

  document.getElementById('page-dashboard').innerHTML = html;
}

function renderFarm() {
  let html = `
  <div class="stab-wrap">
    ${[['plots','🌾 田區'],['ops','✍️ 作業'],['weather','🌤️ 天氣'],['calendar','📅 行事曆']].map(([k,l])=>`
    <button onclick="setFarmSub('${k}')" id="fsub-${k}" class="flex-1 py-1.5 rounded-xl text-xs font-bold transition-all ${farmSub===k?'stab on':'text-stone-500'}">${l}</button>`).join('')}
  </div>`;

  if (farmSub === 'plots')    html += farmPlotsHTML();
  if (farmSub === 'ops')      html += farmOpsHTML();
  if (farmSub === 'weather')  html += farmWeatherHTML();
  if (farmSub === 'calendar') html += farmCalHTML();

  document.getElementById('page-farm').innerHTML = html;
}
function setFarmSub(s){ farmSub=s; renderFarm(); }

/* ── 田區列表 ── */
function farmPlotsHTML() {
  let h = `<button onclick="openPlotModal(null)" class="btn btn-g w-full py-3 rounded-2xl font-bold mb-3" style="border:2px dashed #4ade80;background:#f0fdf4;color:#166534">＋ 新增田區</button>`;
  if (!DB.plots.length) h += `<div style="text-align:center;color:#a8a29e;padding:32px;font-size:13px">尚無田區，請新增</div>`;
  DB.plots.forEach(p=>{
    const m=plotMeta(p); const pt=ptOf(p.type);
    const tkn=(p.harvests||[]).reduce((s,h)=>s+h.kg,0);
    const tbn=(p.harvests||[]).reduce((s,h)=>s+h.bundles,0);
    const bl = p.sold?'#9ca3af':p.closed?'#d6d3d1':pt.color;
    h += `<div class="card p-4 mb-3 ${p.closed||p.sold?'opacity-65':''}" style="border-left:4px solid ${bl}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div style="flex:1;min-width:0">
          <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px">
            <span style="font-weight:900;font-size:16px;font-family:serif">${esc(p.name)}</span>
            ${tagHTML(pt.icon+' '+pt.label, pt.color, pt.bg)}
            ${p.traceability?tagHTML('🏷️ 產銷履歷','#7c3aed','#ede9fe'):''}
            ${p.sold?tagHTML('💰 已賣出','#6b7280','#f3f4f6'):''}
            ${p.closed&&!p.sold?tagHTML('結案','#6b7280','#f3f4f6'):''}
          </div>
          <div style="font-size:12px;color:#78716c;line-height:1.7">
            ${p.area?`面積：${esc(p.area)} 分地&nbsp;&nbsp;`:''}${m.days!==null?`種植第 ${m.days} 天`:''}${p.area&&m.days!==null?'':''}<br>
            ${m.lastSpray?`最後噴藥：${m.lastSpray}<br>`:''}
            ${m.lastFert?`最後施肥：${m.lastFert}<br>`:''}
            ${p.harvestDate?`預計採收：${esc(p.harvestDate)}<br>`:''}
            ${tkn>0?`<span style="color:#16a34a;font-weight:700">已採收：${tbn>0?fmt(tbn)+'捆 · ':''}共 ${fmt(tkn)} kg</span>`:''}
          </div>
          ${p.traceNote?`<div style="margin-top:6px;font-size:11px;color:#7c3aed;background:#ede9fe;border-radius:8px;padding:6px 10px">📋 ${esc(p.traceNote)}</div>`:''}
        </div>
        <div style="text-align:right;margin-left:8px;flex-shrink:0">
          <div style="font-size:11px;color:#a8a29e">種植成本</div>
          <div style="font-weight:900;color:#dc2626">NT$${fmt(m.cost)}</div>
          ${m.costPerFen!==null?`<div style="font-size:10px;color:#a8a29e">≈NT$${fmt(m.costPerFen)}/分</div>`:''}
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px solid #f5f5f4">
        <button onclick="openDetailModal('${p.id}')" class="btn btn-gh btn-sm">詳情</button>
        <button onclick="openPlotModal('${p.id}')" class="btn btn-gh btn-sm">編輯</button>
        <button onclick="openHarvestModal('${p.id}')" class="btn btn-g btn-sm">登採收</button>
        ${!p.sold?`<button onclick="openSellPlotModal('${p.id}')" class="btn btn-b btn-sm">賣出田</button>`:''}
        <button onclick="toggleClosePlot('${p.id}')" class="btn btn-gh btn-sm">${p.closed?'重開':'結案'}</button>
        <button onclick="delPlot('${p.id}')" class="btn btn-r btn-sm">刪除</button>
      </div>
    </div>`;
  });
  return h;
}

/* ── 作業登錄 ── */
function farmOpsHTML() {
  const actPlots = DB.plots.filter(p=>!p.closed&&!p.sold);
  const totalAmt = parseFloat(document.getElementById?.('opAmt')?.value||'0')||0;
  const perPlot  = opSelectedPlots.length ? Math.round(totalAmt/opSelectedPlots.length) : totalAmt;

  // ── 四大成本群組大按鈕 ──
  const groupBtns = COST_GROUPS.map(g => {
    const active = opCostGroup === g.id;
    return `<button onclick="setOpGroup('${g.id}')"
      style="display:flex;flex-direction:column;align-items:flex-start;padding:12px 14px;border-radius:14px;border:2.5px solid ${active?g.color:'#e7e5e4'};background:${active?g.bg:'#fafaf9'};cursor:pointer;font-family:inherit;text-align:left;transition:all .15s">
      <div style="font-size:24px;margin-bottom:4px">${g.icon}</div>
      <div style="font-size:13px;font-weight:900;color:${active?g.color:'#44403c'}">${g.label}</div>
      <div style="font-size:10px;color:${active?g.color:'#a8a29e'};margin-top:2px;line-height:1.4">${g.desc}</div>
      ${active?`<div style="margin-top:6px;width:100%;height:3px;border-radius:2px;background:${g.color}"></div>`:''}
    </button>`;
  }).join('');

  // ── 作業細項（在選了群組後顯示） ──
  let subCatRow = '';
  if (opCostGroup) {
    const grp = COST_GROUPS.find(g=>g.id===opCostGroup);
    // 農資群組顯示噴藥/施肥；其他群組僅1個細項
    const subCats = FARM_CATS.filter(c => grp.cats.includes(c.id));
    if (subCats.length > 1) {
      subCatRow = `<div>
        <div style="font-size:11px;font-weight:700;color:#78716c;margin-bottom:6px">作業細項</div>
        <div style="display:flex;gap:8px">
          ${subCats.map(c=>{
            const a=opCat===c.id;
            return `<button onclick="setOpCat('${c.id}')"
              style="flex:1;padding:8px;border-radius:12px;border:2px solid ${a?c.color:'#e7e5e4'};background:${a?c.bg:'#fafaf9'};font-family:inherit;cursor:pointer">
              <div style="font-size:18px">${c.icon}</div>
              <div style="font-size:12px;font-weight:700;color:${a?c.color:'#78716c'}">${c.label}</div>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    } else if (subCats.length===1 && opCat !== subCats[0].id) {
      // auto-select single sub-cat
      setTimeout(()=>{ opCat=subCats[0].id; },0);
    }
  }

  let plotBtns = actPlots.length===0
    ? `<div style="font-size:13px;color:#92400e;background:#fef3c7;border-radius:12px;padding:10px 14px">請先新增田區</div>`
    : `<div style="display:flex;flex-wrap:wrap;gap:8px">${actPlots.map(p=>{
        const active=opSelectedPlots.includes(p.id);
        const pt=ptOf(p.type);
        return `<button onclick="toggleOpPlot('${p.id}')"
          style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:2px solid ${active?pt.color:'#e7e5e4'};background:${active?pt.bg:'#fafaf9'};cursor:pointer;font-family:inherit">
          <span style="font-size:11px;font-weight:700;color:${active?pt.color:'#78716c'}">${active?'✓ ':''}${esc(p.name)}</span>
          <span style="font-size:9px;color:${active?pt.color:'#a8a29e'}">${pt.icon}${pt.label.replace('田','')}</span>
        </button>`;
      }).join('')}</div>`;

  let splitPreview = '';
  if (opSelectedPlots.length > 0 && totalAmt > 0) {
    splitPreview = `<div style="background:#f5f5f4;border:1px solid #e7e5e4;border-radius:12px;padding:12px">
      <div style="font-size:11px;font-weight:900;color:#57534e;margin-bottom:6px">📊 成本分攤預覽</div>
      ${opSelectedPlots.map(pid=>{
        const pl=DB.plots.find(x=>x.id===pid);
        const area=parseFloat(pl?.area)||0;
        const cpf=area>0?Math.round(perPlot/area):null;
        return `<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="font-weight:700">${esc(pl?.name||'?')}</span>
          <span>NT$${fmt(perPlot)}${cpf!==null?` <span style="color:#a8a29e">（${fmt(cpf)}/分地）</span>`:''}</span></div>`;
      }).join('')}
      ${opSelectedPlots.length>1?`<div style="font-size:11px;color:#a8a29e;border-top:1px solid #e7e5e4;padding-top:6px;margin-top:3px">合計 NT$${fmt(totalAmt)}，每田 NT$${fmt(perPlot)}</div>`:''}
    </div>`;
  }

  const recentOps = DB.ops.slice(0,8);
  let recentHTML = '';
  if (recentOps.length) {
    recentHTML = `<div class="card p-4 mt-4"><div style="font-weight:700;font-size:13px;color:#57534e;margin-bottom:8px">最近 8 筆作業</div>`;
    recentOps.forEach(o=>{
      const pids=Array.isArray(o.plotIds)?o.plotIds:[o.plotId].filter(Boolean);
      const names=pids.map(id=>DB.plots.find(p=>p.id===id)?.name||'?').join('、');
      const c=catOf(FARM_CATS,o.cat);
      const grp=COST_GROUPS.find(g=>g.cats.includes(o.cat))||COST_GROUPS[3];
      recentHTML+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f5f5f4">
        <div style="flex:1;min-width:0">
          <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:2px">
            ${tagHTML(grp.icon+' '+grp.label, grp.color, grp.bg)}
            ${tagHTML(c.icon+' '+c.label, c.color, c.bg)}
            <span style="font-size:11px;color:#a8a29e">${esc(names)}${pids.length>1?` <b style="color:#2563eb">×${pids.length}田</b>`:''}</span>
          </div>
          <div style="font-size:13px;font-weight:600;color:#292524;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.product)}</div>
          <div style="font-size:11px;color:#a8a29e">${o.date}${o.qty?` · ${esc(o.qty)}`:''}${pids.length>1?` · 每田NT$${fmt(o.perPlotAmt)}`:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-left:8px;flex-shrink:0">
          <div style="text-align:right"><div style="font-weight:900;color:#dc2626;font-size:13px">NT$${fmt(o.amount)}</div></div>
          <button onclick="delOp('${o.id}')" style="color:#d6d3d1;font-size:12px;background:none;border:none;cursor:pointer">✕</button>
        </div>
      </div>`;
    });
    recentHTML += `</div>`;
  }

  return `<div class="card p-4">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-weight:900;font-size:16px;font-family:serif">✍️ 田間作業登錄</div>
      <button onclick="openAgriModal()" class="btn btn-p btn-sm">🧪 農資庫</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">

      <!-- ①日期 -->
      <div>
        <div style="font-size:11px;font-weight:700;color:#78716c;margin-bottom:4px">日期 <span style="color:#ef4444">*</span></div>
        <input class="inp" type="date" id="opDate" value="${today()}">
      </div>

      <!-- ②四大成本群組 -->
      <div>
        <div style="font-size:11px;font-weight:700;color:#78716c;margin-bottom:8px">成本類型 <span style="color:#ef4444">*</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${groupBtns}</div>
      </div>

      <!-- ③作業細項（農資才有） -->
      ${subCatRow}

      <!-- ④田區多選 -->
      <div>
        <div style="font-size:11px;font-weight:700;color:#78716c;margin-bottom:6px">田區（可多選，費用平均分攤）<span style="color:#ef4444"> *</span></div>
        ${plotBtns}
        ${opSelectedPlots.length>1?`<div style="margin-top:6px;font-size:12px;color:#1d4ed8;background:#dbeafe;border-radius:10px;padding:6px 12px;font-weight:600">已選 ${opSelectedPlots.length} 個田區，費用將平均分攤</div>`:''}
      </div>

      <!-- ⑤品名 -->
      <div>
        <div style="font-size:11px;font-weight:700;color:#78716c;margin-bottom:4px">品名/項目 <span style="color:#ef4444">*</span></div>
        <input class="inp" type="text" id="opProduct" placeholder="${opCostGroup==='labor'?'例：拔蔥工資、噴藥工資':opCostGroup==='agri'?'例：陶斯松、亞磷酸鉀':opCostGroup==='supply'?'例：紙箱、膠帶、冰磚、油錢':'例：地租、購地款'}">
      </div>

      <!-- ⑥金額 + 用量 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <div style="font-size:11px;font-weight:700;color:#78716c;margin-bottom:4px">總費用（元）<span style="color:#ef4444"> *</span></div>
          <input class="inp" type="number" id="opAmt" placeholder="0" oninput="updateSplit()">
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;color:#78716c;margin-bottom:4px">用量</div>
          <input class="inp" type="text" id="opQty" placeholder="20kg、5L、3人">
        </div>
      </div>
      <div id="splitPreviewArea">${splitPreview}</div>

      <!-- ⑦備註 -->
      <div>
        <div style="font-size:11px;font-weight:700;color:#78716c;margin-bottom:4px">備註</div>

function setOpGroup(g) {
  opCostGroup = opCostGroup===g ? '' : g;
  // auto-assign cat for single-cat groups
  const grp = COST_GROUPS.find(x=>x.id===g);
  if (grp && grp.cats.length===1) opCat = grp.cats[0];
  else if (opCostGroup!==g) opCat='';
  renderFarm();
}
function setOpCat(c){ opCat=c; renderFarm(); }
function updateSplit(){
  const area = document.getElementById('splitPreviewArea');
  if(!area) return;
  const amt = parseFloat(document.getElementById('opAmt')?.value||'0')||0;
  const pct = opSelectedPlots.length||1;
  const per = Math.round(amt/pct);
  if(!opSelectedPlots.length){area.innerHTML='';return;}
  area.innerHTML=`<div style="background:#f5f5f4;border:1px solid #e7e5e4;border-radius:12px;padding:12px">
    <div style="font-size:11px;font-weight:900;color:#57534e;margin-bottom:6px">📊 成本分攤預覽</div>
    ${opSelectedPlots.map(pid=>{const pl=DB.plots.find(x=>x.id===pid);const ar=parseFloat(pl?.area)||0;const cpf=ar>0?Math.round(per/ar):null;return`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:700">${esc(pl?.name||'?')}</span><span>NT$${fmt(per)}${cpf!==null?` <span style="color:#a8a29e">（${fmt(cpf)}/分）</span>`:''}</span></div>`;}).join('')}
    ${opSelectedPlots.length>1?`<div style="font-size:11px;color:#a8a29e;border-top:1px solid #e7e5e4;padding-top:6px;margin-top:3px">合計 NT$${fmt(amt)}，每田 NT$${fmt(per)}</div>`:''}
  </div>`;
}

function saveOp(){
  if(!opSelectedPlots.length||!opCostGroup){alert('請選擇田區與成本類型');return;}
  // ensure opCat is set
  if(!opCat){
    const grp=COST_GROUPS.find(g=>g.id===opCostGroup);
    if(grp) opCat=grp.cats[0];
  }
  const product=document.getElementById('opProduct').value.trim();
  if(!product){alert('請填寫品名');return;}
  const totalAmt=parseFloat(document.getElementById('opAmt').value)||0;
  if(!totalAmt){alert('請填寫費用');return;}
  const perPlotAmt=Math.round(totalAmt/opSelectedPlots.length);
  DB.ops.unshift({
    id:uid(), date:document.getElementById('opDate').value,
    plotIds:opSelectedPlots.slice(), plotId:opSelectedPlots[0],
    costGroup:opCostGroup, cat:opCat,
    product, amount:totalAmt, perPlotAmt,
    qty:document.getElementById('opQty').value,
    note:document.getElementById('opNote').value,
  });
  saveDB();
  opCat=''; opCostGroup='';
  document.getElementById('opSaveBtn').textContent='✓ 已儲存！';
  document.getElementById('opSaveBtn').style.background='#22c55e';
  setTimeout(()=>renderFarm(), 1500);
}
function delOp(id){ DB.ops=DB.ops.filter(o=>o.id!==id); saveDB(); renderFarm(); }

/* ── 行事曆 ── */
function farmCalHTML(){
  const [y,m] = calYm.split('-').map(Number);
  const firstDay = new Date(y,m-1,1).getDay();
  const daysInMonth = new Date(y,m,0).getDate();
  const todayStr = today();

  const evMap = {};
  const addEv = (ds,label,color,icon,type='') => {
    if(!ds||!ds.startsWith(calYm)) return;
    const d=parseInt(ds.slice(8,10));
    if(!evMap[d]) evMap[d]=[];
    evMap[d].push({label,color,icon,type});
  };

  // 田區里程碑
  DB.plots.forEach(p=>{
    addEv(p.plantDate, `${p.name} 種植`, '#15803d','🌱','milestone');
    addEv(p.ridgeDate, `${p.name} 培土`, '#92400e','⛏️','milestone');
    addEv(p.harvestDate,`${p.name} 採收`, '#d97706','🧺','milestone');
  });
  // 作業記錄
  DB.ops.forEach(o=>{
    if(!o.date?.startsWith(calYm)) return;
    const d=parseInt(o.date.slice(8,10));
    if(!evMap[d]) evMap[d]=[];
    const grp=COST_GROUPS.find(g=>g.id===o.costGroup)||COST_GROUPS[0];
    const pids=Array.isArray(o.plotIds)?o.plotIds:[o.plotId].filter(Boolean);
    const pl=pids.length>1?`×${pids.length}田`:(DB.plots.find(p=>p.id===pids[0])?.name||'?');
    evMap[d].push({label:`${pl} ${grp.label}`, color:grp.color, icon:grp.icon, type:'op'});
  });
  // 天氣
  DB.weather.forEach(w=>{
    if(!w.date?.startsWith(calYm)) return;
    const d=parseInt(w.date.slice(8,10));
    if(!evMap[d]) evMap[d]=[];
    const wt=WEATHER_TYPES.find(t=>t.id===w.weather)||WEATHER_TYPES[0];
    evMap[d].push({label:wt.label, color:wt.color, icon:wt.icon, type:'weather'});
  });
  // ★ SOP 排程事件
  getSopCalEvents(calYm).forEach(ev=>{
    const d=parseInt(ev.date.slice(8,10));
    if(!evMap[d]) evMap[d]=[];
    evMap[d].push({label:ev.label, color:ev.color, icon:ev.icon, type:'sop'});
  });

  const cells=[];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);

  let calRows='';
  for(let i=0;i<cells.length;i+=7){
    const row=cells.slice(i,i+7);
    calRows+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px">`;
    row.forEach(d=>{
      if(!d){calRows+=`<div></div>`;return;}
      const ds=`${calYm}-${String(d).padStart(2,'0')}`;
      const evs=evMap[d]||[];
      const isT=ds===todayStr;
      const hasMilestone=evs.some(e=>e.type==='milestone');
      const hasOp=evs.some(e=>e.type==='op');
      const hasSop=evs.some(e=>e.type==='sop');
      const bgCol = isT?'#f0fdf4': hasMilestone?'#fef9ee': hasSop?'#f5f3ff':'transparent';
      const bdrCol = isT?'#16a34a': hasMilestone?'#d97706': hasSop?'#7c3aed':'transparent';
      calRows+=`<div onclick="calDayClick('${ds}')"
        style="min-height:52px;border-radius:8px;padding:2px;border:1.5px solid ${bdrCol};background:${bgCol};cursor:pointer;transition:background .1s"
        title="${ds} — 點擊快速登錄作業">
        <div style="font-size:11px;font-weight:700;text-align:center;margin-bottom:2px;color:${isT?'#16a34a':'#44403c'}">${d}</div>
        ${evs.slice(0,2).map(e=>`<div style="font-size:8px;border-radius:3px;padding:1px 2px;overflow:hidden;white-space:nowrap;margin-bottom:1px;background:${e.color}22;color:${e.color};line-height:1.3">${e.icon}${esc(e.label)}</div>`).join('')}
        ${evs.length>2?`<div style="font-size:8px;color:#a8a29e;text-align:center">+${evs.length-2}</div>`:''}
        ${hasOp?`<div style="width:4px;height:4px;border-radius:50%;background:#dc2626;margin:1px auto 0"></div>`:''}
      </div>`;
    });
    calRows+=`</div>`;
  }

  // 圖例
  const legend = [
    {color:'#16a34a',label:'今天'},
    {color:'#d97706',label:'田區里程碑'},
    {color:'#dc2626',label:'有作業記錄'},
    {color:'#7c3aed',label:'SOP排程'},
  ].map(l=>`<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#6b7280">
    <span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${l.color};opacity:.7"></span>${l.label}
  </span>`).join('');

  // 本月摘要
  const thisMonthOps = DB.ops.filter(o=>o.date?.startsWith(calYm));
  const opTotal = thisMonthOps.reduce((s,o)=>s+o.amount,0);
  const opByGroup = {};
  COST_GROUPS.forEach(g=>{ opByGroup[g.id]=thisMonthOps.filter(o=>o.costGroup===g.id||g.cats.includes(o.cat)).reduce((s,o)=>s+o.amount,0); });

  return `
  <!-- 月份摘要 -->
  ${opTotal>0?`<div class="card p-3 mb-3">
    <div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:6px">${y}/${String(m).padStart(2,'0')} 月成本摘要　<b style="color:#dc2626">NT$${fmt(opTotal)}</b></div>
    <div style="display:flex;flex-wrap:wrap;gap:5px">
      ${COST_GROUPS.map(g=>opByGroup[g.id]>0?`<div style="background:${g.bg};border-radius:8px;padding:3px 8px;font-size:10px;font-weight:700;color:${g.color}">${g.icon} ${g.label} NT$${fmt(opByGroup[g.id])}</div>`:'').join('')}
    </div>
  </div>`:''}

  <div class="card p-4">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <button onclick="shiftCal(-1)" style="width:32px;height:32px;border-radius:50%;background:#f5f5f4;border:none;cursor:pointer;font-size:16px">‹</button>
      <div>
        <div style="font-weight:900;font-family:serif;text-align:center">${y} 年 ${m} 月</div>
        <div style="font-size:10px;color:#a8a29e;text-align:center;margin-top:2px">點日期 → 快速登錄作業</div>
      </div>
      <button onclick="shiftCal(1)" style="width:32px;height:32px;border-radius:50%;background:#f5f5f4;border:none;cursor:pointer;font-size:16px">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px">
      ${['日','一','二','三','四','五','六'].map(w=>`<div style="text-align:center;font-size:10px;font-weight:700;color:#a8a29e;padding:3px">${w}</div>`).join('')}
    </div>
    ${calRows}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #f5f5f4">${legend}</div>
  </div>`;
}
function shiftCal(d){
  const [y,m]=calYm.split('-').map(Number);
  const nd=new Date(y,m-1+d,1);
  calYm=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`;
  renderFarm();
}
function calDayClick(ds){
  // jump to ops tab with date pre-filled
  farmSub='ops';
  renderFarm();
  setTimeout(()=>{
    const el=document.getElementById('opDate');
    if(el) el.value=ds;
  },50);
}

            </div>
            <div style="display:flex;gap:4px;margin-left:8px;flex-shrink:0">
              <button onclick="setAgriUse('${item.id}')" class="btn btn-g btn-sm">使用</button>

          </div>

          <div style="margin-top:10px;padding-top:10px;border-top:1px solid #f5f5f4">
            <div style="font-size:11px;font-weight:700;color:#78716c;margin-bottom:4px">本次使用量（${esc(item.unit)}）</div>
            <input class="inp" id="agriUseAmt" type="number" placeholder="0" oninput="updateAgriCost(${p.toFixed(4)})">

          </div>`:''}`
      }).join('');

function setAgriTab(t){ agriTab=t; agriUseItem=null; renderAgriModal(); }
function setAgriUse(id){ agriUseItem=agriUseItem?.id===id?null:DB.agri.find(x=>x.id===id); renderAgriModal(); }
function updateAgriCost(ppu){ const a=parseFloat(document.getElementById('agriUseAmt')?.value)||0; const cost=Math.round(ppu*a); const el=document.getElementById('agriCostPreview'); if(el&&a>0) el.innerHTML=`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px;text-align:center;margin-top:6px"><div style="font-size:10px;color:#d97706">本次成本</div><div style="font-weight:900;font-size:20px;color:#d97706">NT$${fmt(cost)}</div></div>`; else if(el) el.innerHTML=''; }
function applyAgriUse(itemId,name,unit){
  const item=DB.agri.find(x=>x.id===itemId); if(!item) return;
  const usedAmt=parseFloat(document.getElementById('agriUseAmt')?.value)||0;
  if(!usedAmt){alert('請填寫使用量');return;}
  const ppu=(item.purchasePrice||0)/(item.totalVol||1);
  const cost=Math.round(ppu*usedAmt);
  // 帶回作業登錄
  agriUseItem=null; _closeModal(); farmSub='ops'; renderFarm();
  setTimeout(()=>{
    const pEl=document.getElementById('opProduct'); if(pEl) pEl.value=name;
    const aEl=document.getElementById('opAmt'); if(aEl){ aEl.value=cost; updateSplit(); }
    const qEl=document.getElementById('opQty'); if(qEl) qEl.value=usedAmt+unit;
    // set cat to spray
    opCat='spray'; renderFarm();
    setTimeout(()=>{ const pEl2=document.getElementById('opProduct'); if(pEl2) pEl2.value=name; const aEl2=document.getElementById('opAmt'); if(aEl2){ aEl2.value=cost; updateSplit(); } const qEl2=document.getElementById('opQty'); if(qEl2) qEl2.value=usedAmt+unit; },100);
  },50);
}
function delAgri(id){ DB.agri=DB.agri.filter(x=>x.id!==id); saveDB(); renderAgriModal(); }
function saveAgri(){
  const name=document.getElementById('ag_name').value.trim();
  const vol=parseFloat(document.getElementById('ag_vol').value)||0;
  const price=parseFloat(document.getElementById('ag_price').value)||0;
  if(!name||!vol||!price){alert('請填寫名稱、容量、價格');return;}
  DB.agri.push({id:uid(),name,spec:document.getElementById('ag_spec').value,totalVol:vol,unit:document.getElementById('ag_unit').value,purchasePrice:price});
  saveDB(); agriTab='list'; renderAgriModal();
}

// ── SVG 圓餅圖通用函式 ──
function makePie(slices, cx=50, r=42, ri=18) {
  // slices: [{label, value, color}]
  const total = slices.reduce((s,x)=>s+x.value,0);
  if (!total) return '';
  let cum = 0;
  let paths = '';
  slices.forEach(s => {
    const start = cum / total;
    cum += s.value;
    const end = cum / total;
    if (s.value <= 0) return;
    const a1 = start*Math.PI*2 - Math.PI/2;
    const a2 = end  *Math.PI*2 - Math.PI/2;
    const x1=cx+r*Math.cos(a1), y1=50+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2), y2=50+r*Math.sin(a2);
    const large = (end-start) > 0.5 ? 1 : 0;
    const d = s.value===total
      ? `M ${cx} ${50-r} a ${r} ${r} 0 1 1 -0.001 0 Z`
      : `M ${cx} 50 L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
    paths += `<path d="${d}" fill="${s.color}" stroke="white" stroke-width="1"/>`;
  });
  return paths + `<circle cx="${cx}" cy="50" r="${ri}" fill="white"/>`;
}

    bMap[key].revenue += s.revenue;
    bMap[key].kg      += s.kg||0;
    bMap[key].count   += 1;
    if (s.date||s.dateFrom) bMap[key].dates.push(s.date||s.dateFrom);
    if (s.product) bMap[key].products.add(s.product);
    if (s.channel) bMap[key].channels.add(s.channel);
  });

  const buyers = Object.entries(bMap).map(([name,v])=>({
    name, revenue:v.revenue, kg:v.kg, count:v.count,
    avgPrice: v.kg>0 ? (v.revenue/v.kg) : 0,
    lastDate: v.dates.sort().at(-1)||'',
    products: [...v.products].map(id=>SALE_PRODS.find(p=>p.id===id)?.label||id).join('、'),
    channels: [...v.channels].map(id=>CHANNELS.find(c=>c.id===id)?.label||id).join('、'),
  })).sort((a,b)=>b.avgPrice-a.avgPrice);

  const maxAvg  = Math.max(...buyers.map(b=>b.avgPrice), 1);
  const totalRev = DB.sales.reduce((s,x)=>s+x.revenue,0);
  const best = buyers[0];

  // ── 圓餅1：收入佔比（按買家）──
  const revPieSlices = buyers.map((b,i)=>({label:b.name, value:b.revenue, color:COLORS[i%COLORS.length]}));
  const revPiePaths  = makePie(revPieSlices);

  // ── 圓餅2：銷售管道佔比（按channel）──
  const chMap2 = {};
  DB.sales.forEach(s=>{ const c=s.channel||'other'; if(!chMap2[c]) chMap2[c]=0; chMap2[c]+=s.revenue; });
  const chPieSlices = Object.entries(chMap2).map(([id,v],i)=>({label:CHANNELS.find(c=>c.id===id)?.label||id, value:v, color:COLORS[i%COLORS.length]}));
  const chPiePaths  = makePie(chPieSlices, 50);

  // ── SVG 橫向單價條形圖 ──
  const barH=26, gap=8, barTop=18;
  const chartH = buyers.length*(barH+gap)+barTop+10;
  let bars='';
  buyers.forEach((b,i)=>{
    const pct=b.avgPrice/maxAvg;
    const y=barTop+i*(barH+gap);
    const clr=COLORS[i%COLORS.length];
    const bw=Math.max(pct*82,3); // max 82% to leave room for label
    bars+=`<rect x="0" y="${y}" width="${bw}%" height="${barH}" rx="5" fill="${clr}" opacity="0.88"/>
    <text x="4" y="${y+17}" font-size="10" font-weight="700" fill="white">${esc(b.name.slice(0,9))}${b.name.length>9?'…':''}</text>
    <text x="${bw+1}%" y="${y+17}" font-size="10" font-weight="900" fill="${clr}" text-anchor="start"> $${Math.round(b.avgPrice)}/kg</text>`;
  });

  return `
  <!-- 最佳買家 banner -->
  <div class="card p-4 mb-3" style="border:2px solid #fde68a;background:linear-gradient(135deg,#fffbeb,#fef9c3)">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="font-size:32px">🏆</div>
      <div>
        <div style="font-size:11px;color:#92400e;font-weight:700">目前最佳單價買家</div>
        <div style="font-size:20px;font-weight:900;color:#78350f;font-family:serif">${esc(best.name)}</div>
        <div style="font-size:13px;color:#d97706;font-weight:700">均價 NT$${Math.round(best.avgPrice)}/kg · 累計 NT$${fmt(best.revenue)}</div>
      </div>
    </div>
  </div>

  <!-- 單價條形圖 -->
  <div class="card p-4 mb-3">
    <div style="font-weight:900;font-size:14px;margin-bottom:4px">📊 各買家平均單價（高→低）</div>
    <div style="font-size:10px;color:#a8a29e;margin-bottom:8px">橫條長度代表相對單價</div>
    <svg viewBox="0 0 300 ${chartH}" width="100%" style="display:block;overflow:visible">
      <text x="0" y="13" font-size="9" fill="#a8a29e">元/kg</text>
      ${bars}
    </svg>
  </div>

  <!-- 兩個圓餅並排 -->
  <div class="card p-4 mb-3">
    <div style="font-weight:900;font-size:14px;margin-bottom:12px">🥧 銷售比重分析</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

      <!-- 買家收入佔比 -->
      <div>
        <div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:6px;text-align:center">買家收入佔比</div>
        <svg viewBox="0 0 100 100" width="100%" style="display:block;max-width:120px;margin:0 auto">${revPiePaths}</svg>
        <div style="margin-top:8px;space-y:4px">
          ${revPieSlices.map((s,i)=>{const pct=totalRev>0?Math.round(s.value/totalRev*100):0;return`<div style="display:flex;align-items:center;gap:4px;margin-bottom:3px"><div style="width:8px;height:8px;border-radius:50%;background:${s.color};flex-shrink:0"></div><span style="font-size:10px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.label)}</span><span style="font-size:10px;font-weight:700;color:#374151;flex-shrink:0">${pct}%</span></div>`;}).join('')}
        </div>
      </div>

      <!-- 渠道佔比 -->
      <div>
        <div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:6px;text-align:center">銷售渠道佔比</div>
        <svg viewBox="0 0 100 100" width="100%" style="display:block;max-width:120px;margin:0 auto">${chPiePaths}</svg>
        <div style="margin-top:8px">
          ${chPieSlices.map((s,i)=>{const pct=totalRev>0?Math.round(s.value/totalRev*100):0;return`<div style="display:flex;align-items:center;gap:4px;margin-bottom:3px"><div style="width:8px;height:8px;border-radius:50%;background:${s.color};flex-shrink:0"></div><span style="font-size:10px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.label)}</span><span style="font-size:10px;font-weight:700;color:#374151;flex-shrink:0">${pct}%</span></div>`;}).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- 買家明細卡 -->
  <div class="card p-4 mb-3">
    <div style="font-weight:900;font-size:14px;margin-bottom:10px">🏪 買家明細</div>
    ${buyers.map((b,i)=>{
      const revPct=totalRev>0?Math.round(b.revenue/totalRev*100):0;
      const clr=COLORS[i%COLORS.length];
      const rank=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
      return`<div style="padding:10px 0;border-bottom:1px solid #f5f5f4">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:15px">${rank}</span>
              <span style="font-weight:900;font-size:15px">${esc(b.name)}</span>
              ${b.avgPrice===maxAvg?`<span style="font-size:10px;background:#fef3c7;color:#d97706;padding:1px 6px;border-radius:6px;font-weight:700">最高單價</span>`:''}
            </div>
            <div style="font-size:11px;color:#78716c;margin-top:2px">
              ${b.count}筆 · ${b.kg>0?b.kg+'kg · ':''}最近 ${b.lastDate||'—'}
              ${b.products?`<br>${esc(b.products)}`:''}
              ${b.channels?`<span style="color:#0369a1"> · ${esc(b.channels)}</span>`:''}
            </div>
          </div>
          <div style="text-align:right;margin-left:8px;flex-shrink:0">
            <div style="font-weight:900;font-size:18px;color:${clr}">$${Math.round(b.avgPrice)}<span style="font-size:10px">/kg</span></div>
            <div style="font-size:11px;color:#78716c">NT$${fmt(b.revenue)}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="bar" style="flex:1"><div class="bar-fill" style="width:${revPct}%;background:${clr}"></div></div>
          <span style="font-size:10px;color:#a8a29e;width:26px;text-align:right;flex-shrink:0">${revPct}%</span>
        </div>
      </div>`;
    }).join('')}
  </div>

  <!-- 策略建議 -->
  <div class="card p-4" style="border-left:4px solid #166534">
    <div style="font-weight:900;font-size:13px;color:#166534;margin-bottom:8px">💡 市場策略建議</div>
    <div style="font-size:12px;color:#374151;line-height:1.9">
      ${buyers.length>=2?`
      ✅ <b>${esc(best.name)}</b> 均價最高（NT$${Math.round(best.avgPrice)}/kg），建議主力供貨<br>
      ⚠️ <b>${esc(buyers[buyers.length-1].name)}</b> 均價最低（NT$${Math.round(buyers[buyers.length-1].avgPrice)}/kg），可考慮調整比例<br>
      ${buyers.length>=3?`📊 前三名平均：NT$${Math.round((buyers[0].avgPrice+buyers[1].avgPrice+buyers[2].avgPrice)/3)}/kg`:''}
      `:`目前 ${buyers.length} 位買家，累積更多資料後分析更準確`}
    </div>
  </div>`;
}

/* ── 結算作帳 ── */
// 結算成本類型對應（從 ERP 各模塊映射到會計科目）
const ACCT_CATS = [
  { id:'purchase',  label:'購買成本',   icon:'🛒', color:'#7c3aed', bg:'#ede9fe',
    match: o => ['spray','fertilize','other'].includes(o.cat) && o._src==='farm' ||
                ['supply_pack','misc'].includes(o.cat) && o._src==='proc' },
  { id:'labor',     label:'人事成本',   icon:'👥', color:'#1d4ed8', bg:'#dbeafe',
    match: o => o.cat==='labor' && o._src==='farm' ||
                ['harvest_labor','manpower','tie_cost'].includes(o.cat) && o._src==='proc' },
  { id:'supply',    label:'消耗品',     icon:'📦', color:'#d97706', bg:'#fef3c7',
    match: o => ['ridge','irrigate'].includes(o.cat) && o._src==='farm' ||
                ['fuel','utility'].includes(o.cat) && o._src==='proc' },
  { id:'other',     label:'其他開銷',   icon:'📋', color:'#6b7280', bg:'#f3f4f6',
    match: o => false }, // 剩餘全歸此
];

function classifyAcct(item) {
  for (const cat of ACCT_CATS.slice(0,-1)) {
    if (cat.match(item)) return cat.id;
  }
  return 'other';
}

function reportSettlementHTML() {
  const saved = DB.settlements||[];

  let previewHTML = '';

  if (stFrom && stTo && settlePlots.length > 0) {
    const from=stFrom, to=stTo;
    const inRange = d => d && d >= from && d <= to;
    const inPlot  = ids => (Array.isArray(ids)?ids:[ids].filter(Boolean)).some(id=>settlePlots.includes(id));

    // 種植作業
    const farmRows = DB.ops.filter(o => inRange(o.date) && inPlot(Array.isArray(o.plotIds)?o.plotIds:[o.plotId].filter(Boolean))).map(o=>({...o,_src:'farm'}));
    // 運營成本
    const procRows = DB.proc.filter(o => inRange(o.date)).map(o=>({...o,_src:'proc'}));
    // 銷售收入
    const saleRows = DB.sales.filter(s => {
      const d=s.date||s.dateFrom;
      const plotMatch = !s.plotId || settlePlots.includes(s.plotId);
      return inRange(d) && plotMatch;
    });

    const allCostRows = [...farmRows, ...procRows];
    const saleTotal = saleRows.reduce((s,x)=>s+x.revenue,0);
    const totalCost = allCostRows.reduce((s,o)=>s+o.amount,0);
    const profit    = saleTotal - totalCost;
    const plotNames = settlePlots.map(id=>DB.plots.find(p=>p.id===id)?.name||'?').join('、');

    // 按會計科目分組
    const acctGroups = {};
    ACCT_CATS.forEach(c => { acctGroups[c.id]={rows:[],total:0}; });
    allCostRows.forEach(o => {
      const aid = classifyAcct(o);
      acctGroups[aid].rows.push(o);
      acctGroups[aid].total += o.amount;
    });

    // 成本結構圓餅
    const acctPieSlices = ACCT_CATS.map(c=>({label:c.label,value:acctGroups[c.id].total,color:c.color})).filter(x=>x.value>0);
    const acctPiePaths  = makePie(acctPieSlices);

    // 收入圓餅（按產品）
    const prodMap={};
    saleRows.forEach(s=>{ const k=SALE_PRODS.find(p=>p.id===s.product)?.label||'其他'; if(!prodMap[k]) prodMap[k]=0; prodMap[k]+=s.revenue; });
    const PCOLS=['#16a34a','#0369a1','#d97706','#7c3aed','#0891b2'];
    const salePieSlices=Object.entries(prodMap).map(([l,v],i)=>({label:l,value:v,color:PCOLS[i%5]}));
    const salePiePaths =makePie(salePieSlices);

    previewHTML = `
    <div class="card p-4 mt-4" style="border:2px solid ${profit>=0?'#bbf7d0':'#fecaca'}">

      <!-- 結算標題 -->
      <div style="background:${profit>=0?'linear-gradient(135deg,#052e16,#166534)':'linear-gradient(135deg,#450a0a,#991b1b)'};border-radius:14px;padding:16px;margin-bottom:14px;text-align:center;color:#fff">
        <div style="font-size:11px;opacity:.75;margin-bottom:2px">結算區間</div>
        <div style="font-size:13px;font-weight:700;margin-bottom:2px">${from} ～ ${to}</div>
        <div style="font-size:11px;opacity:.7;margin-bottom:10px">田區：${esc(plotNames)}</div>
        <div style="font-size:11px;font-weight:700;opacity:.8">本期淨損益</div>
        <div style="font-size:32px;font-weight:900;font-family:serif;color:${profit>=0?'#86efac':'#fca5a5'}">${profit>=0?'▲ +':'▼ '}NT$${fmt(Math.abs(profit))}</div>
      </div>

      <!-- 三欄金額 -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
        <div style="background:#fef2f2;border-radius:12px;padding:10px;text-align:center">
          <div style="font-size:10px;color:#ef4444">總成本</div>
          <div style="font-weight:900;font-size:15px;color:#dc2626">NT$${fmt(totalCost)}</div>
          <div style="font-size:9px;color:#a8a29e">${allCostRows.length}筆</div>
        </div>
        <div style="background:#f0fdf4;border-radius:12px;padding:10px;text-align:center">
          <div style="font-size:10px;color:#16a34a">總收入</div>
          <div style="font-weight:900;font-size:15px;color:#16a34a">NT$${fmt(saleTotal)}</div>
          <div style="font-size:9px;color:#a8a29e">${saleRows.length}筆</div>
        </div>
        <div style="background:${profit>=0?'#f0fdf4':'#fef2f2'};border-radius:12px;padding:10px;text-align:center">
          <div style="font-size:10px;color:#6b7280">損益</div>
          <div style="font-weight:900;font-size:15px;color:${profit>=0?'#16a34a':'#dc2626'}">${profit>=0?'▲':'▼'}NT$${fmt(Math.abs(profit))}</div>
        </div>
      </div>

      <!-- 兩個圓餅並排 -->
      ${(acctPieSlices.length||salePieSlices.length)?`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        ${acctPieSlices.length?`<div>
          <div style="font-size:11px;font-weight:700;text-align:center;margin-bottom:6px">成本結構</div>
          <svg viewBox="0 0 100 100" width="100%" style="display:block;max-width:110px;margin:0 auto">${acctPiePaths}</svg>
          <div style="margin-top:6px">${acctPieSlices.map(s=>{const pct=totalCost>0?Math.round(s.value/totalCost*100):0;return`<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px"><div style="width:7px;height:7px;border-radius:50%;background:${s.color};flex-shrink:0"></div><span style="font-size:10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.label}</span><b style="font-size:10px;flex-shrink:0">${pct}%</b></div>`;}).join('')}</div>
        </div>`:'<div></div>'}
        ${salePieSlices.length?`<div>
          <div style="font-size:11px;font-weight:700;text-align:center;margin-bottom:6px">收入來源</div>
          <svg viewBox="0 0 100 100" width="100%" style="display:block;max-width:110px;margin:0 auto">${salePiePaths}</svg>
          <div style="margin-top:6px">${salePieSlices.map(s=>{const pct=saleTotal>0?Math.round(s.value/saleTotal*100):0;return`<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px"><div style="width:7px;height:7px;border-radius:50%;background:${s.color};flex-shrink:0"></div><span style="font-size:10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.label}</span><b style="font-size:10px;flex-shrink:0">${pct}%</b></div>`;}).join('')}</div>
        </div>`:'<div></div>'}
      </div>`:''}

      <!-- 成本科目明細（四類） -->
      ${ACCT_CATS.map(cat=>{
        const grp=acctGroups[cat.id];
        if(!grp.rows.length) return '';
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div style="font-size:12px;font-weight:900" style="color:${cat.color}">${tagHTML(cat.icon+' '+cat.label,cat.color,cat.bg)}</div>
            <b style="font-size:13px;color:#dc2626">NT$${fmt(grp.total)}</b>
          </div>
          ${grp.rows.sort((a,b)=>a.date.localeCompare(b.date)).map(o=>{
            const src=o._src==='farm'?catOf(FARM_CATS,o.cat):catOf(PROC_CATS,o.cat);
            const pids=Array.isArray(o.plotIds)?o.plotIds:[o.plotId].filter(Boolean);
            const pname=o._src==='farm'?pids.map(id=>DB.plots.find(p=>p.id===id)?.name||'?').join('、'):'';
            return`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #f5f5f4">
              <div style="flex:1;min-width:0">${tagHTML(src.icon+' '+src.label,src.color,src.bg)} ${esc(o.product)} <span style="color:#a8a29e">${o.date}${pname?' · '+esc(pname):''}${o.qty?' · '+esc(o.qty):''}</span></div>
              <b style="color:#dc2626;flex-shrink:0;margin-left:4px">NT$${fmt(o.amount)}</b>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}

      <!-- 收入明細 -->
      ${saleRows.length?`<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          ${tagHTML('💰 收入項目','#15803d','#dcfce7')}
          <b style="font-size:13px;color:#16a34a">NT$${fmt(saleTotal)}</b>
        </div>
        ${saleRows.sort((a,b)=>(a.date||a.dateFrom).localeCompare(b.date||b.dateFrom)).map(s=>{
          const prod=SALE_PRODS.find(p=>p.id===s.product);
          return`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #f5f5f4">
            <div style="flex:1;min-width:0">${prod?tagHTML(prod.icon+' '+prod.label,'#15803d','#dcfce7'):''} ${esc(s.buyer||'—')} <span style="color:#a8a29e">${s.date||s.dateFrom}${s.kg>0?' · '+s.kg+'kg':''}</span></div>
            <b style="color:#16a34a;flex-shrink:0;margin-left:4px">NT$${fmt(s.revenue)}</b>
          </div>`;
        }).join('')}
      </div>`:''}

      <!-- 儲存 -->
      <div style="padding-top:10px;border-top:1px solid #e7e5e4">
        <button onclick="saveSettlement()" class="btn btn-g btn-lg">💾 儲存此份結算單</button>
      </div>
    </div>`;

    // 暫存本次結算資料供儲存用
    window._pendingSettlement = { from, to, profit, plotNames,
      totalCost:fmt(totalCost), saleTotal:fmt(saleTotal),
      farmTotal:fmt(farmRows.reduce((s,o)=>s+o.amount,0)),
      procTotal:fmt(procRows.reduce((s,o)=>s+o.amount,0)),
      purchase:fmt(acctGroups.purchase.total), labor:fmt(acctGroups.labor.total),
      supply:fmt(acctGroups.supply.total), other:fmt(acctGroups.other.total),
    };
  }

  // 已儲存結算單
  let savedHTML = '';
  if (saved.length) {
    savedHTML = `<div class="card p-4 mt-4">
      <div style="font-weight:900;font-size:13px;margin-bottom:10px">📁 已儲存結算單（${saved.length}份）</div>
      ${saved.slice().reverse().map(r=>`
      <div style="padding:10px 0;border-bottom:1px solid #f5f5f4">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font-size:12px;font-weight:700">${esc(r.from)} ～ ${esc(r.to)}</div>
            <div style="font-size:11px;color:#78716c">${esc(r.plotNames)}</div>
            <div style="font-size:10px;color:#a8a29e;margin-top:2px">
              購買 NT$${esc(r.purchase||'0')} · 人事 NT$${esc(r.labor||'0')} · 消耗品 NT$${esc(r.supply||'0')} · 其他 NT$${esc(r.other||'0')}<br>
              收入 NT$${esc(r.saleTotal)} · 成本 NT$${esc(r.totalCost)}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:8px">
            <div style="font-weight:900;font-size:14px;color:${r.profit>=0?'#16a34a':'#dc2626'}">${r.profit>=0?'▲':'▼'} NT$${fmt(Math.abs(r.profit))}</div>
            <button onclick="delSettlement('${r.id}')" style="color:#d6d3d1;font-size:14px;background:none;border:none;cursor:pointer">✕</button>

function toggleSettlePlot(id) {
  settlePlots = settlePlots.includes(id) ? settlePlots.filter(x=>x!==id) : [...settlePlots,id];
  renderReports();
}
function toggleAllSettlePlots() {
  settlePlots = settlePlots.length===DB.plots.length ? [] : DB.plots.map(p=>p.id);
  renderReports();
}
function saveSettlement() {
  const d = window._pendingSettlement;
  if (!d) return;
  if (!DB.settlements) DB.settlements = [];
  DB.settlements.push({ id:uid(), ...d, savedAt:today() });
  try { localStorage.setItem('hp6_settlements', JSON.stringify(DB.settlements)); } catch {}
  window._pendingSettlement = null;
  alert('✅ 結算單已儲存！');
  renderReports();
}
function delSettlement(id) {
  DB.settlements = (DB.settlements||[]).filter(x=>x.id!==id);
  try { localStorage.setItem('hp6_settlements', JSON.stringify(DB.settlements)); } catch {}
  renderReports();
}

function exportBackup() {
  const payload = {
    version: 1,
    exportedAt: new Date().toISOString(),
    data: {
      plots:       DB.plots,
      ops:         DB.ops,
      agri:        DB.agri,
      proc:        DB.proc,
      sales:       DB.sales,
      weather:     DB.weather,
      settlements: DB.settlements||[],
    }
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `鋐品農產行備份_${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const payload = JSON.parse(ev.target.result);
        if (!payload.data) throw new Error('格式錯誤');
        const d = payload.data;
        if (!confirm(`確定要還原備份？\n匯出時間：${payload.exportedAt?.slice(0,10)||'未知'}\n\n⚠️ 這會覆蓋目前所有資料，無法還原。`)) return;
        DB.plots       = d.plots       || [];
        DB.ops         = d.ops         || [];
        DB.agri        = d.agri        || [];
        DB.proc        = d.proc        || [];
        DB.sales       = d.sales       || [];
        DB.weather     = d.weather     || [];
        DB.settlements = d.settlements || [];
        saveDB();
        try { localStorage.setItem('hp6_settlements', JSON.stringify(DB.settlements)); } catch {}
        alert('✅ 還原成功！');
        renderAll();
      } catch(err) {
        alert('❌ 還原失敗：' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function openBackupModal() {
  openModal(`
    <div style="font-weight:900;font-size:16px;font-family:serif;margin-bottom:16px">💾 資料備份 / 還原</div>
