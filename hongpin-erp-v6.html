    note:'鉀為主，充實蔥白膨大' },

  { id:'s11', dayFrom:78, dayTo:82, phase:'後期',
    type:'agri',   icon:'🌿', color:'#16a34a', bg:'#dcfce7',
    title:'灌根',
    items:['木黴菌 + 樂根'] },

  { id:'s12', dayFrom:82, dayTo:88, phase:'後期',
    type:'labor',  icon:'🌾', color:'#1d4ed8', bg:'#dbeafe',
    title:'第5次追肥（高鉀）',
    items:['宜農5號 1包/分地（高鉀）'],
    note:'高鉀促進轉色充實' },

  { id:'s13', dayFrom:85, dayTo:90, phase:'轉色期',
    type:'agri',   icon:'🌟', color:'#7c3aed', bg:'#ede9fe',
    title:'葉面轉色肥',
    items:['海藻精','磷酸二氫鉀','左旋胺基酸','安盾'],
    note:'促進葉色黑綠、轉色整齊' },

  { id:'s14', dayFrom:92, dayTo:97, phase:'採收前',
    type:'labor',  icon:'💪', color:'#db2777', bg:'#fce7f3',
    title:'採收前衝刺肥（視情況）',
    items:['宜農1號 1包/分地 沖施'],
    note:'⚠️ 蔥漂亮厚實才衝，衝完3-5天內必採收' },

  { id:'s15', dayFrom:98, dayTo:105, phase:'採收',
    type:'supply', icon:'🧺', color:'#d97706', bg:'#fef3c7',
    title:'採收',
    items:['觀察蔥白粗度與葉色決定採收時機'],
    note:'目標：蔥白粗、葉片黑綠厚實' },
];

const PHASE_COLORS = {
  '定植':'#15803d','開根':'#0891b2','分蘖前':'#1d4ed8','分蘖期':'#d97706',
  '生長期':'#16a34a','培土期':'#92400e','膨大期':'#7c3aed','後期':'#0369a1',
  '轉色期':'#7c3aed','採收前':'#db2777','採收':'#d97706',
};

// localStorage key for SOP schedules
const LS_SOP = 'hp6_sop_schedules';
let DB_SOP = []; // [{id, plotId, bindDate, doneSteps:[stepId,...], note}]
try { DB_SOP = JSON.parse(localStorage.getItem(LS_SOP))||[]; } catch { DB_SOP=[]; }
function saveSOP(){ try{ localStorage.setItem(LS_SOP,JSON.stringify(DB_SOP)); }catch{} }

// 工具：計算日期字串 + N 天
function addDays(dateStr, n) {
  const d = new Date(dateStr);
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
// 計算今天是種植後第幾天
function daysFromPlant(plantDate) {
  if(!plantDate) return null;
  return Math.floor((Date.now()-new Date(plantDate))/86400000);
}

let sopSelPlot = ''; // 目前 SOP 頁選中田區

function renderSOP() {
  const actPlots = DB.plots.filter(p=>!p.closed&&!p.sold);
  const allPlots = DB.plots;

  // 取得或建立該田區的 SOP 排程
  let schedule = sopSelPlot ? DB_SOP.find(s=>s.plotId===sopSelPlot) : null;
  const plot = sopSelPlot ? DB.plots.find(p=>p.id===sopSelPlot) : null;
  const plantDate = plot?.plantDate || null;
  const dayNow = plantDate ? daysFromPlant(plantDate) : null;

  // 核心原則
  const principles = [
    {icon:'⚠️',text:'亞磷酸鉀嚴格60天前用完，60天後停止'},
    {icon:'📉',text:'氮肥前期用、中後期明顯減少'},
    {icon:'🔄',text:'菌種輪替：木黴菌與芽孢桿菌交替'},
    {icon:'⛏️',text:'培土至少2次'},
    {icon:'🌟',text:'後期重點：轉色 + 充實（磷鉀 + 胺基酸）'},
  ];

  let html = `
  <!-- 標題 -->
  <div style="border-radius:20px;padding:16px 18px;background:linear-gradient(135deg,#052e16,#14532d);color:#fff;margin-bottom:12px">
    <div style="font-size:10px;letter-spacing:3px;opacity:.6;margin-bottom:4px">STANDARD OPERATING PROCEDURE</div>
    <div style="font-size:18px;font-weight:900;font-family:serif;margin-bottom:2px">粉蔥種植 SOP</div>
    <div style="font-size:12px;opacity:.75">100天版 v5.1 · 目標：蔥白粗、葉片黑綠厚實</div>
  </div>

  <!-- 田區選擇 -->
  <div class="card p-4 mb-3">
    <div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:8px">🌾 選擇田區（自動帶入種植日期計算排程）</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${sopSelPlot?8:0}px">
      <button onclick="setSopPlot('')" class="pill ${!sopSelPlot?'on':''}">僅看SOP</button>
      ${allPlots.map(p=>`<button onclick="setSopPlot('${p.id}')" class="pill ${sopSelPlot===p.id?'on':''}">${esc(p.name)}${p.plantDate?` (Day${daysFromPlant(p.plantDate)?daysFromPlant(p.plantDate):'0'})`:''}</button>`).join('')}
    </div>
    ${plot&&plantDate?`<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f0fdf4;border-radius:10px">
      <span style="font-size:20px">🌱</span>
      <div>
        <div style="font-size:12px;font-weight:700;color:#166534">${esc(plot.name)} — 種植日：${plantDate}</div>
        <div style="font-size:11px;color:#16a34a">今天是種植後第 <b>${dayNow}</b> 天　${dayNow<=100?`還剩 <b>${100-dayNow}</b> 天到採收`:'已超過100天'}</div>
      </div>
    </div>`:''}
    ${sopSelPlot&&!plantDate?`<div style="font-size:12px;color:#d97706;background:#fef3c7;border-radius:10px;padding:8px 12px">⚠️ 此田區尚未設定種植日期，請先在「田區」頁面編輯</div>`:''}
  </div>

  <!-- 進度條（綁定田區時顯示） -->
  ${plantDate&&dayNow!==null?`<div class="card p-4 mb-3">
    <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#374151;margin-bottom:8px">
      <span>整體進度</span>
      <span style="color:${dayNow>=100?'#16a34a':'#d97706'}">${Math.min(dayNow,100)}/100 天</span>
    </div>
    <div style="height:10px;border-radius:999px;background:#e5e2db;overflow:hidden;margin-bottom:6px">
      <div style="height:100%;border-radius:999px;background:linear-gradient(90deg,#15803d,#22c55e);width:${Math.min(dayNow/100*100,100)}%;transition:width .5s"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#a8a29e">
      <span>定植</span><span>分蘖(25天)</span><span>培土(50天)</span><span>轉色(85天)</span><span>採收(100天)</span>
    </div>
    <!-- 完成筆數 -->
    ${schedule?`<div style="margin-top:8px;font-size:11px;color:#374151">
      已完成 <b style="color:#16a34a">${schedule.doneSteps?.length||0}</b> / ${SOP_STEPS.length} 個作業節點
    </div>`:''}
  </div>`:''}

  <!-- SOP 作業時程表 -->
  <div style="margin-bottom:12px">`;

  // 按 phase 分組渲染
  let lastPhase = '';
  SOP_STEPS.forEach(step => {
    const isDone = schedule?.doneSteps?.includes(step.id);
    const phColor = PHASE_COLORS[step.phase]||'#6b7280';

    // 計算預計日期（若有綁定田區）
    let dateRange = '';
    let statusLabel = '';
    let statusColor = '#6b7280';
    let urgentBanner = '';

    if (plantDate) {
      const dateFrom = addDays(plantDate, step.dayFrom);
      const dateTo   = addDays(plantDate, step.dayTo);
      dateRange = step.dayFrom===step.dayTo ? dateFrom : `${dateFrom} ～ ${dateTo}`;

      if (isDone) {
        statusLabel = '✅ 已完成';
        statusColor = '#16a34a';
      } else if (dayNow !== null) {
        if (dayNow < step.dayFrom) {
          const daysLeft = step.dayFrom - dayNow;
          statusLabel = `📅 還有 ${daysLeft} 天`;
          statusColor = daysLeft<=5 ? '#d97706' : '#6b7280';
          if (daysLeft<=3) urgentBanner = `<div style="background:#fef3c7;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:#d97706;margin-bottom:4px">⚡ 即將到來（${daysLeft}天後）</div>`;
        } else if (dayNow >= step.dayFrom && dayNow <= step.dayTo) {
          statusLabel = '🔥 現在進行！';
          statusColor = '#dc2626';
          urgentBanner = `<div style="background:#fef2f2;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:#dc2626;margin-bottom:4px">🔥 本週應執行！</div>`;
        } else if (dayNow > step.dayTo && !isDone) {
          const overdue = dayNow - step.dayTo;
          statusLabel = `⚠️ 已逾 ${overdue} 天`;
          statusColor = '#dc2626';
        }
      }
    }

    // phase 分隔標題
    if (step.phase !== lastPhase) {
      html += `<div style="display:flex;align-items:center;gap:8px;margin:${lastPhase?'16px':0} 0 8px">
        <div style="height:2px;flex:1;background:${phColor};opacity:.3"></div>
        <div style="font-size:11px;font-weight:900;color:${phColor};padding:2px 10px;border-radius:999px;border:1.5px solid ${phColor}20;background:${phColor}10">${step.phase} 期</div>
        <div style="height:2px;flex:1;background:${phColor};opacity:.3"></div>
      </div>`;
      lastPhase = step.phase;
    }

    html += `<div style="border-radius:14px;border:2px solid ${isDone?'#bbf7d0':step.dayFrom<=60&&step.items.some(x=>x.includes('亞磷'))?'#fde68a':'#e5e2db'};background:${isDone?'#f0fdf4':'#fff'};padding:12px 14px;margin-bottom:8px;${isDone?'opacity:.7':''}">
      ${urgentBanner}
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">
            <span style="background:${step.bg};color:${step.color};font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px">${step.icon} Day ${step.dayFrom}${step.dayFrom!==step.dayTo?`-${step.dayTo}`:''}</span>
            ${dateRange?`<span style="font-size:10px;color:#a8a29e">${dateRange}</span>`:''}
          </div>
          <div style="font-weight:900;font-size:14px;color:#1a1a1a;margin-bottom:5px">${step.title}</div>
          <ul style="margin:0;padding-left:16px;font-size:12px;color:#374151;line-height:1.8">
            ${step.items.map(it=>`<li>${esc(it)}</li>`).join('')}
          </ul>
          ${step.note?`<div style="margin-top:6px;font-size:11px;color:${step.note.includes('⚠️')||step.note.includes('⭐')?'#d97706':'#6b7280'};font-style:italic">${esc(step.note)}</div>`:''}
        </div>
        <div style="margin-left:10px;flex-shrink:0;text-align:right">
          ${plantDate?`<div style="font-size:11px;font-weight:700;color:${statusColor};margin-bottom:6px">${statusLabel}</div>`:''}
          ${schedule?`<button onclick="toggleSopDone('${sopSelPlot}','${step.id}')"
            style="padding:5px 10px;border-radius:8px;border:1.5px solid ${isDone?'#16a34a':'#e5e2db'};background:${isDone?'#f0fdf4':'#fafaf7'};color:${isDone?'#16a34a':'#78716c'};font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">
            ${isDone?'✅ 已完成':'○ 標記完成'}
          </button>`:''}
        </div>
      </div>
    </div>`;
  });

  // 核心原則
  html += `</div>
  <div class="card p-4 mb-3" style="border-left:4px solid #d97706">
    <div style="font-weight:900;font-size:13px;color:#d97706;margin-bottom:10px">📌 核心原則</div>
    ${principles.map(p=>`<div style="display:flex;gap:8px;margin-bottom:7px;font-size:12px;color:#374151;line-height:1.6">
      <span style="flex-shrink:0">${p.icon}</span><span>${p.text}</span>
    </div>`).join('')}
  </div>

  <!-- 說明 -->
  ${!sopSelPlot?`<div style="background:#f0fdf4;border-radius:12px;padding:12px 14px;font-size:12px;color:#374151;line-height:1.8">
    💡 <b>使用方式：</b>選擇上方田區，系統會依種植日期自動計算每個作業的預計日期，並在行事曆上顯示 SOP 排程。可點「標記完成」追蹤進度。
  </div>`:''}`;

  document.getElementById('page-sop').innerHTML = html;
}

function setSopPlot(pid) {
  sopSelPlot = pid;
  // 若尚無排程，自動建立
  if (pid && !DB_SOP.find(s=>s.plotId===pid)) {
    DB_SOP.push({id:uid(), plotId:pid, doneSteps:[], createdAt:today()});
    saveSOP();
  }
  renderSOP();
}

function toggleSopDone(plotId, stepId) {
  const sch = DB_SOP.find(s=>s.plotId===plotId);
  if (!sch) return;
  if (!sch.doneSteps) sch.doneSteps=[];
  if (sch.doneSteps.includes(stepId)) {
    sch.doneSteps = sch.doneSteps.filter(x=>x!==stepId);
  } else {
    sch.doneSteps.push(stepId);
  }
  saveSOP();
  renderSOP();
}

/* ── SOP 事件整合進行事曆 ── */
// 這個函式在 farmCalHTML 中被呼叫，為所有有 SOP 排程的田區加入事件
function getSopCalEvents(ym) {
  const events = [];
  DB_SOP.forEach(sch => {
    const plot = DB.plots.find(p=>p.id===sch.plotId);
    if (!plot?.plantDate) return;
    SOP_STEPS.forEach(step => {
      const dateFrom = addDays(plot.plantDate, step.dayFrom);
      if (!dateFrom.startsWith(ym)) return;
      const isDone = sch.doneSteps?.includes(step.id);
      events.push({
        date: dateFrom,
        label: `${plot.name} ${step.title.split('（')[0].slice(0,8)}`,
        color: isDone ? '#16a34a' : step.color,
        icon:  isDone ? '✅' : step.icon,
        type: 'sop',
      });
    });
  });
  return events;
}

switchMain('dashboard');
</script>
